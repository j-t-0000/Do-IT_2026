#regelt, wie nginx-Verbindungen annimmt
events {}     
#alles Web-relevante  
http {
    #mime-types, damit nginx den Datentyp einer Datei weiß
    include                                 /etc/nginx/mime.types;
    #virtueller Server
    server {
        #auf welchen Port soll gelauscht werden
        listen                              443 ssl;
        #location des Zertifikates und Schlüssel
        ssl_certificate                     /etc/nginx/certs/cert.pem;
        ssl_certificate_key                 /etc/nginx/certs/key.pem;
        #Dashboard-Block - statisch
        location / {
            root                            /web;
        }
        #Api-Block - dynamisch
        location /api/status {
            fastcgi_pass                    php-fpm-container:9000;        #reich Anfrage per FastCGI an php-fpm auf port 9000 weiter
            include                         /etc/nginx/fastcgi_params;          #parameter, damit php-fpm weiß, was es tun soll
            fastcgi_param SCRIPT_FILENAME   /app-code/web_status.php;     #Skript, dass php-fpm tun soll
        }
    }
    #http-redirect
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }
}