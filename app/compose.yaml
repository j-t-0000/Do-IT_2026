services:
  
  php-fpm-debian-service:
    image: php:8.4.27-fpm-bookworm        #Update auf aktuelle Version für den Patch
    container_name: php-fpm-container
    networks:
      - proxy-net
      - monitoring-internal
    volumes:
      - monitoring-data:/data   #Quelle:Ziel
      - ./code:/app-code:ro               #ro: read only, zusätzliches volume, wo code/skripte drin liegen
  
  nginx-service:
    image: nginx:1.31.6-trixie
    container_name: nginx_proxy_web
    depends_on:
      - php-fpm-debian-service
    ports:
      - "443:443"
      - "80:80"
    networks:
      - proxy-net
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../certs:/etc/nginx/certs:ro

  test-refused-service:
    image: alpine:3.24.2
    container_name: alpine_test_refused
    command: ["sleep", "infinity"]
    networks:
      - monitoring-internal

  #für down fall: nur ein fiktiver Container in der services.json

  test-web-listener:
    image: alpine:3.24.2
    container_name: alpine_test_web_listener
    command: ["nc", "-lk", "-p", "80", "-e", "/bin/true"]
    networks:
      - monitoring-internal
  
  test-sql-listener:
    image: alpine:3.24.2
    container_name: alpine_test_sql_listener
    command: ["nc", "-lk", "-p", "1433", "-e", "/bin/true"]
    networks:
      - monitoring-internal

  test-ssh-listener:
    image: alpine:3.24.2
    container_name: alpine_test_ssh_listener
    command: ["nc", "-lk", "-p", "22", "-e", "/bin/true"]
    networks:
      - monitoring-internal

  test-mail-listener:
    image: alpine:3.24.2
    container_name: alpine_test_mail_listener
    command: ["nc", "-lk", "-p", "587", "-e", "/bin/true"]
    networks:
      - monitoring-internal

networks:
  proxy-net:
  monitoring-internal:
    internal: true

volumes:
  monitoring-data:
