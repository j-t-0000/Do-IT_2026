services:
  
  php-fpm-debian-service:
    image: php:8.4.26-fpm-bookworm
    container_name: php-fpm-container
    networks:
      - proxy-net
      - monitoring-internal
    volumes:
      - monitoring-data:~/data/   #Quelle:Ziel
  
  nginx-service:
    image: nginx:1.31.6-trixie
    container_name: nginx_proxy_web
    ports:
      - "443:443"
      - "80:80"
    networks:
      - proxy-net

  test-web-service:
    image: alpine:3.24.2
    container_name: alpine_test_web
    networks:
      - monitoring-internal

networks:
  proxy-net:
  monitoring-internal:
    internal: true

volumes:
  monitoring-data:
